services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: library_loans
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123
    volumes:
      - library-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_loans"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/library_loans
      DB_UNAME: postgres
      DB_PASS: Password123
    depends_on:
      db:
        condition: service_healthy

volumes:
  library-data:

